<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SazónTrack - Gestión de Modificadores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-offwhite: #FDFCF8;
            --bg-ivory: #F3F0E9;
            --color-nude: #E3DBCC;
            --text-dark: #2A2621;
            --text-muted: #736B60;
            --sidebar-width: 250px;
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body { background-color: var(--bg-ivory); color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; }

        /* === Sidebar === */
        .sidebar { width: var(--sidebar-width); background: var(--bg-offwhite); border-right: 1px solid var(--color-nude); height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; padding: 1.4rem 1rem; z-index: 100; }
        .brand-header { display: flex; align-items: center; gap: 12px; padding-bottom: 1.2rem; border-bottom: 1px solid var(--color-nude); margin-bottom: 1rem; }
        .brand-avatar { width: 42px; height: 42px; background: var(--text-dark); color: var(--bg-offwhite); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .brand-title { font-family: 'Italianno', cursive; font-size: 2.1rem; margin: 0; line-height: 0.8; }
        .brand-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-nav .nav-link { color: var(--text-muted); font-weight: 600; font-size: 0.88rem; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; text-decoration: none; transition: var(--transition-smooth); }
        .sidebar-nav .nav-link:hover { background: rgba(227, 219, 204, 0.4); color: var(--text-dark); transform: translateX(4px); }
        .sidebar-nav .nav-link.active { background: var(--text-dark); color: var(--bg-offwhite); box-shadow: 0 6px 16px rgba(42,38,33,0.2); }
        .nav-category { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 800; margin: 1.5rem 0 0.5rem 0.8rem; }

        .main-wrapper { margin-left: var(--sidebar-width); padding: 2.5rem; }

        /* === Animaciones === */
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-entrada { animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }

        /* === Listas y Cards === */
        .panel-derecho { background: #fff; border: 1px solid var(--color-nude); border-radius: 20px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.02); min-height: 500px; }

        .table-custom { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .table-custom thead th { border: none; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 0 1rem 0.5rem 1rem; font-weight: 800; }
        .table-custom tbody tr { background: var(--bg-offwhite); border-radius: 12px; transition: var(--transition-smooth); }
        .table-custom tbody tr:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(42,38,33,0.05); }
        .table-custom td { padding: 1rem; border: none; vertical-align: middle; }
        .table-custom td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .table-custom td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

        .badge-extra-activo { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; }

        .modal-content { border-radius: 20px; border: none; }
        .modal-header { background: var(--bg-offwhite); border-bottom: 1px solid var(--color-nude); border-radius: 20px 20px 0 0; }
        .form-control, .form-select { border-radius: 10px; padding: 10px 14px; border-color: var(--color-nude); background-color: var(--bg-offwhite); font-weight: 600; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-scrollable">
        <div class="brand-header">
            <div class="brand-avatar"><i class="fa-solid fa-calculator"></i></div>
            <div>
                <h2 class="brand-title">SazónTrack</h2>
                <span class="brand-sub">Admin POS</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-category">Almacén y Menú</div>
            <a href="inventario.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
            <a href="recetas.html" class="nav-link"><i class="fa-solid fa-book-open"></i> Escandallos</a>
            <a href="modificadores.html" class="nav-link active"><i class="fa-solid fa-code-branch"></i> Modificadores</a>

            <div class="nav-category">Operación</div>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="caja.html" class="nav-link"><i class="fa-solid fa-cash-register"></i> Caja POS</a>
        </nav>
    </div>
</aside>

<main class="main-wrapper">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 animate-entrada">
        <div>
            <h4 class="fw-800 m-0"><i class="fa-solid fa-code-branch me-2 text-muted"></i>Gestión de Extras / Modificadores</h4>
            <small class="text-muted fw-bold">Crea, edita o cancela extras directos que aparecerán en Caja POS sin necesidad de grupos</small>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-secondary rounded-pill px-3 py-2" id="totalExtras">0 Extras</span>
            <button type="button" class="btn btn-dark rounded-pill fw-bold px-4 shadow-sm" onclick="abrirModalExtra()">
                <i class="fa-solid fa-plus me-2"></i> Nuevo Extra
            </button>
        </div>
    </div>

    <!-- Panel Principal Directo de Extras -->
    <div class="panel-derecho animate-entrada delay-1" id="panelDetalle">
        <div class="text-center py-5">
            <div class="spinner-border text-dark"></div>
        </div>
    </div>
</main>

<!-- Modal: Crear / Editar Extra Directo -->
<div class="modal fade" id="modalExtra" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-800" id="tituloModalExtra">Nuevo Extra para Caja</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="idExtraEditando" value="">
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Nombre del Extra / Ingrediente</label>
                    <input type="text" id="nombreExtra" class="form-control" placeholder="Ej. Tocino, Aguacate, Queso extra">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Costo Extra ($)</label>
                    <input type="number" id="precioExtra" class="form-control" placeholder="0.00" step="0.01" min="0" value="0.00">
                </div>
            </div>
            <div class="modal-footer border-0 p-4 pt-0">
                <button type="button" class="btn btn-outline-secondary rounded-pill fw-bold px-4" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-dark rounded-pill fw-bold px-4" onclick="guardarExtra()">Guardar Extra</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_MODIFICADORES = 'api/modificadores/index.php';
    const modalExtraInst = new bootstrap.Modal(document.getElementById('modalExtra'));
    let listaExtras = [];

    document.addEventListener('DOMContentLoaded', cargarExtras);

    async function cargarExtras() {
        const panel = document.getElementById('panelDetalle');
        try {
            const resp = await fetch(`${API_MODIFICADORES}?accion=listar_opciones`);
            const data = await resp.json();
            listaExtras = Array.isArray(data) ? data : (data.data || data.modificadores || []);

            document.getElementById('totalExtras').innerText = `${listaExtras.length} ${listaExtras.length === 1 ? 'Extra' : 'Extras'}`;
            renderizarTablaExtras(panel);
        } catch (error) {
            console.error(error);
            panel.innerHTML = `<p class="text-danger text-center py-4 fw-bold">Error al cargar los extras desde el servidor.</p>`;
        }
    }

    function renderizarTablaExtras(panel) {
        let filasHtml = '';

        if (!listaExtras.length) {
            filasHtml = `
                <tr>
                    <td colspan="4" class="text-center py-4 text-muted fw-semibold">
                        No hay extras registrados. Haz clic en <strong>+ Nuevo Extra</strong> para agregar el primero.
                    </td>
                </tr>
            `;
        } else {
            listaExtras.forEach(item => {
                const id = item.id_opcion ?? item.id;
                const nombre = item.nombre ?? item.nombre_modificador ?? '';
                const precio = parseFloat(item.precio_extra ?? item.precio ?? 0).toFixed(2);
                const nombreSeguro = encodeURIComponent(nombre);

                filasHtml += `
                    <tr>
                        <td>
                            <div class="fw-bold text-dark">${nombre}</div>
                        </td>
                        <td>
                            <span class="badge-extra-activo">Activo en Caja</span>
                        </td>
                        <td class="fw-bold text-success">+$${precio}</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill fw-bold px-3 me-1"
                                    onclick="abrirModalEditarExtra(${id}, '${nombreSeguro}', ${precio})" title="Editar Extra">
                                <i class="fa-solid fa-pen me-1"></i>Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger rounded-pill fw-bold px-3"
                                    onclick="cancelarExtra(${id})" title="Cancelar Extra">
                                <i class="fa-solid fa-ban me-1"></i>Cancelar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        panel.innerHTML = `
            <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-4 gap-2">
                <div>
                    <h5 class="fw-800 text-dark m-0">Extras Disponibles en Caja</h5>
                    <small class="text-muted fw-semibold">Cada extra se muestra directo al personalizar un platillo en Caja POS</small>
                </div>
                <button type="button" class="btn btn-sm btn-dark rounded-pill fw-bold px-3" onclick="abrirModalExtra()">
                    <i class="fa-solid fa-plus me-1"></i> Agregar Extra
                </button>
            </div>

            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th style="width: 40%">Extra / Ingrediente</th>
                            <th style="width: 20%">Estado</th>
                            <th style="width: 18%">Cobro Extra ($)</th>
                            <th style="width: 22%" class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filasHtml}
                    </tbody>
                </table>
            </div>
        `;
    }

    function abrirModalExtra() {
        document.getElementById('idExtraEditando').value = '';
        document.getElementById('tituloModalExtra').innerText = 'Nuevo Extra para Caja';
        document.getElementById('nombreExtra').value = '';
        document.getElementById('precioExtra').value = '0.00';
        modalExtraInst.show();
    }

    function abrirModalEditarExtra(id, nombreCodificado, precioActual) {
        document.getElementById('idExtraEditando').value = id;
        document.getElementById('tituloModalExtra').innerText = 'Editar Extra';
        document.getElementById('nombreExtra').value = decodeURIComponent(nombreCodificado);
        document.getElementById('precioExtra').value = parseFloat(precioActual || 0).toFixed(2);
        modalExtraInst.show();
    }

    async function guardarExtra() {
        const idEdit = document.getElementById('idExtraEditando').value;
        const nombre = document.getElementById('nombreExtra').value.trim();
        const precio_extra = parseFloat(document.getElementById('precioExtra').value || '0');

        if (!nombre) {
            alert('El nombre del extra es obligatorio.');
            return;
        }
        if (isNaN(precio_extra) || precio_extra < 0) {
            alert('Ingresa un costo extra válido.');
            return;
        }

        const payload = idEdit
            ? { accion: 'editar_opcion', id_opcion: parseInt(idEdit, 10), nombre, precio_extra }
            : { accion: 'crear_opcion', nombre, precio_extra };

        try {
            const resp = await fetch(API_MODIFICADORES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const res = await resp.json();

            if (res.status === 'success') {
                modalExtraInst.hide();
                await cargarExtras();
            } else {
                alert(res.message || 'No se pudo guardar el extra.');
            }
        } catch (error) {
            console.error(error);
            alert('Error de comunicación al guardar el extra.');
        }
    }

    async function cancelarExtra(id) {
        if (!confirm('¿Cancelar este extra para que ya no aparezca disponible en Caja?')) return;

        try {
            const resp = await fetch(API_MODIFICADORES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accion: 'eliminar_opcion', id_opcion: id })
            });
            const res = await resp.json();

            if (res.status === 'success') {
                await cargarExtras();
            } else {
                alert(res.message || 'No se pudo cancelar el extra.');
            }
        } catch (error) {
            console.error(error);
            alert('Error de comunicación al cancelar el extra.');
        }
    }
</script>
</script>
</body>
</html>
