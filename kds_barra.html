<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SazónTrack - KDS Barra</title>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-offwhite: #FDFCF8;
            --bg-ivory: #F3F0E9;
            --color-nude: #E3DBCC;
            --text-dark: #2A2621;
            --text-muted: #736B60;
            --sidebar-width: 240px;
        }
        body { background-color: var(--bg-ivory); color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; }
        .sidebar { width: var(--sidebar-width); background: var(--bg-offwhite); border-right: 1px solid var(--color-nude); height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 1.4rem 1rem; }
        .brand-header { display: flex; align-items: center; gap: 12px; padding-bottom: 1.2rem; border-bottom: 1px solid var(--color-nude); margin-bottom: 1rem; }
        .brand-avatar { width: 42px; height: 42px; background: #2563EB; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .brand-title { font-family: 'Italianno', cursive; font-size: 2.1rem; margin: 0; line-height: 0.8; }
        .brand-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
        .nav-link { color: var(--text-muted); font-weight: 600; font-size: 0.88rem; padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; text-decoration: none; }
        .nav-link:hover { background: var(--bg-ivory); color: var(--text-dark); }
        .nav-link.active { background: var(--text-dark); color: var(--bg-offwhite); }
        .main-wrapper { margin-left: var(--sidebar-width); padding: 2rem; }
        .filter-pill { border-radius: 30px; padding: 7px 18px; font-weight: 700; font-size: 0.85rem; border: 1px solid var(--color-nude); background: #fff; color: var(--text-muted); cursor: pointer; }
        .filter-pill.active { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }
        .ticket-card { background: #fff; border-radius: 18px; border: 1px solid var(--color-nude); border-top: 6px solid #2563EB; box-shadow: 0 6px 18px rgba(42,38,33,0.05); overflow: hidden; transition: 0.2s; }
        .ticket-card.alerta { border-top-color: #F59E0B; }
        .ticket-card.urgente { border-top-color: #EF4444; }
        .item-row { padding: 12px 16px; border-bottom: 1px solid var(--bg-ivory); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .item-row.en-prep { background-color: #DBEAFE; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div>
        <div class="brand-header">
            <div class="brand-avatar"><i class="fa-solid fa-martini-glass"></i></div>
            <div>
                <h2 class="brand-title">SazónTrack</h2>
                <span class="brand-sub">KDS Barra Pro</span>
            </div>
        </div>
        <nav>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="mesas.html" class="nav-link"><i class="fa-solid fa-utensils"></i> Mapa Mesas</a>
            <a href="kds_cocina.html" class="nav-link"><i class="fa-solid fa-fire-burner"></i> KDS Cocina</a>
            <a href="kds_barra.html" class="nav-link active"><i class="fa-solid fa-martini-glass"></i> KDS Barra</a>
        </nav>
    </div>
    <div class="pt-3 border-top">
        <small class="text-muted fw-bold d-block" id="wsStatus"><i class="fa-solid fa-circle text-warning me-1"></i> Conectando WS...</small>
    </div>
</aside>

<main class="main-wrapper">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
        <div>
            <h3 class="fw-800 m-0"><i class="fa-solid fa-martini-glass text-primary me-2"></i>KDS - Pantalla de Barra</h3>
            <small class="text-muted fw-semibold">Control de producción, ruteo FIFO y bebidas consolidadas</small>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-dark rounded-pill fw-bold btn-sm px-3" onclick="cargarBarra()"><i class="fa-solid fa-rotate me-1"></i> Actualizar</button>
            <span class="badge bg-primary text-white rounded-pill px-3 py-2 fw-bold"><i class="fa-solid fa-bolt me-1"></i> Live WS</span>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div class="d-flex gap-2">
            <button class="filter-pill active" onclick="filtrarEstado('TODOS', this)">Todos</button>
            <button class="filter-pill" onclick="filtrarEstado('PENDIENTE', this)"><span class="text-warning">●</span> Pendientes</button>
            <button class="filter-pill" onclick="filtrarEstado('PREPARANDO', this)"><span class="text-primary">●</span> Preparación</button>
        </div>
        <div class="d-flex gap-2">
            <span class="badge rounded-pill px-3 py-2 text-dark" style="background:#22D3EE;">&lt; 10 min (Normal)</span>
            <span class="badge rounded-pill px-3 py-2 text-dark" style="background:#FBBF24;">10 - 15 min (Alerta)</span>
            <span class="badge rounded-pill px-3 py-2 text-white" style="background:#EF4444;">&gt; 15 min (Urgente)</span>
        </div>
    </div>

    <div class="row g-4" id="gridBarra"></div>
</main>

<script>
    const ESTACION = 'barra';
    let filtroActual = 'TODOS';
    const WS_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'http://179.66.132.102:3000';

    const scriptWs = document.createElement('script');
    scriptWs.src = `${WS_URL}/socket.io/socket.io.js`;
    scriptWs.onload = () => {
        const socket = io(WS_URL);
        socket.on('connect', () => {
            document.getElementById('wsStatus').innerHTML = '<i class="fa-solid fa-circle text-success me-1"></i> WebSocket Activo';
        });
        socket.on('renderizar_kds', () => cargarBarra());
        window.socketKds = socket;
    };
    scriptWs.onerror = () => {
        document.getElementById('wsStatus').innerHTML = '<i class="fa-solid fa-circle text-secondary me-1"></i> Modo Polling (5s)';
    };
    document.body.appendChild(scriptWs);

    document.addEventListener('DOMContentLoaded', () => {
        cargarBarra();
        setInterval(cargarBarra, 5000);
    });

    function filtrarEstado(estado, btn) {
        filtroActual = estado;
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cargarBarra();
    }

    async function cargarBarra() {
        try {
            const resp = await fetch(`api/estaciones_kds/obtener_comandas.php?estacion=${ESTACION}`);
            const res = await resp.json();
            const grid = document.getElementById('gridBarra');
            const tickets = res.data || [];

            let tarjetasRenderizadas = 0;
            let htmlAcumulado = '';

            tickets.forEach(cmd => {
                const detallesFiltrados = filtroActual === 'TODOS'
                    ? cmd.detalles
                    : cmd.detalles.filter(d => d.estado_kds === filtroActual || (filtroActual === 'PREPARANDO' && d.estado_kds === 'EN_PREPARACION'));

                if (detallesFiltrados.length === 0) return;
                tarjetasRenderizadas++;

                const mins = parseInt(cmd.minutos_espera || 0);
                let claseTiempo = mins > 15 ? 'urgente' : (mins >= 10 ? 'alerta' : '');
                const badgeOrigen = cmd.origen === 'MÓVIL'
                    ? '<span class="badge bg-info text-dark ms-1">MÓVIL</span>'
                    : '<span class="badge bg-secondary ms-1">WEB</span>';

                let itemsHtml = '';
                detallesFiltrados.forEach(det => {
                    const enPrep = (det.estado_kds === 'PREPARANDO' || det.estado_kds === 'EN_PREPARACION');
                    const notas = det.notas ? `<div class="small text-primary fw-bold"><i class="fa-solid fa-triangle-exclamation me-1"></i>${det.notas}</div>` : '';
                    const badgeEstado = enPrep ? '<span class="badge bg-primary text-white ms-1" style="font-size:0.65rem;">PREPARANDO</span>' : '';

                    itemsHtml += `
                        <div class="item-row ${enPrep ? 'en-prep' : ''}">
                            <div>
                                <div class="fw-bold"><span class="badge bg-primary me-2">${det.cantidad}x</span>${det.platillo} ${badgeEstado}</div>
                                ${notas}
                            </div>
                            <div class="d-flex gap-1">
                                ${!enPrep ? `<button type="button" class="btn btn-sm btn-outline-primary rounded-circle" title="Preparar bebida" onclick="cambiarEstado(${det.id_detalle}, 0, 'PREPARANDO', this)"><i class="fa-solid fa-blender"></i></button>` : ''}
                                <button type="button" class="btn btn-sm btn-outline-success rounded-circle" title="Marcar bebida lista" onclick="cambiarEstado(${det.id_detalle}, 0, 'LISTO', this)"><i class="fa-solid fa-check"></i></button>
                            </div>
                        </div>`;
                });

                htmlAcumulado += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="ticket-card ${claseTiempo}">
                            <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-800">${cmd.mesa} ${badgeOrigen}</div>
                                    <small class="text-muted">${cmd.folio}</small>
                                </div>
                                <span class="badge bg-primary rounded-pill px-3 py-2">${mins} min</span>
                            </div>
                            <div>${itemsHtml}</div>
                            <div class="p-3 bg-white">
                                <button type="button" class="btn btn-primary w-100 fw-bold rounded-pill" onclick="cambiarEstado(0, ${cmd.id_orden}, 'LISTO', this)">
                                    <i class="fa-solid fa-bell-concierge me-1"></i> Despachar Barra
                                </button>
                            </div>
                        </div>
                    </div>`;
            });

            if (tarjetasRenderizadas === 0) {
                grid.innerHTML = `<div class="col-12 text-center py-5 text-muted fw-bold">Sin bebidas pendientes en esta vista de Barra.</div>`;
            } else {
                grid.innerHTML = htmlAcumulado;
            }
        } catch (e) { console.error("Error KDS Barra:", e); }
    }

    async function cambiarEstado(idDetalle, idOrden, nuevoEstado, btn) {
        if (btn) btn.disabled = true;
        try {
            const resp = await fetch('api/estaciones_kds/despachar_orden.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id_detalle: idDetalle,
                    id_orden: idOrden,
                    estacion: ESTACION,
                    estado: nuevoEstado
                })
            });
            const res = await resp.json();
            if (res.status === 'success' || res.ok) {
                if (window.socketKds) {
                    window.socketKds.emit('platillo_preparado', { id_detalle: idDetalle, id_orden: idOrden, estacion: ESTACION, estado: nuevoEstado });
                }
                await cargarBarra();
            } else {
                alert('Error al actualizar: ' + (res.message || 'Verifica despachar_orden.php'));
                if (btn) btn.disabled = false;
            }
        } catch (e) {
            alert('Error de conexión con despachar_orden.php');
            if (btn) btn.disabled = false;
        }
    }
</script>
</body>
</html>
