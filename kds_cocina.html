<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-offwhite: #FDFCF8;
            --bg-ivory: #F3F0E9;
            --color-nude: #E3DBCC;
            --text-dark: #2A2621;
            --text-muted: #736B60;
            --sidebar-width: 250px;
        }
        body { background-color: var(--bg-ivory); color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: var(--bg-offwhite); border-right: 1px solid var(--color-nude); height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; padding: 1.4rem 1rem; z-index: 100; }
        .sidebar-scrollable { overflow-y: auto; flex-grow: 1; }
        .brand-header { display: flex; align-items: center; gap: 12px; padding-bottom: 1.2rem; border-bottom: 1px solid var(--color-nude); margin-bottom: 1rem; }
        .brand-avatar { width: 42px; height: 42px; background: #f39c12; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .brand-title { font-family: 'Italianno', cursive; font-size: 2.1rem; margin: 0; line-height: 0.8; }
        .brand-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
        .sidebar-nav .nav-link { color: var(--text-muted); font-weight: 600; font-size: 0.88rem; padding: 9px 14px; border-radius: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; text-decoration: none; }
        .sidebar-nav .nav-link:hover { background: var(--bg-ivory); color: var(--text-dark); }
        .sidebar-nav .nav-link.active { background: var(--text-dark); color: var(--bg-offwhite); }
        .user-profile { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--color-nude); display: flex; align-items: center; justify-content: space-between; }
        .main-wrapper { margin-left: var(--sidebar-width); padding: 2rem; }
        
        .kds-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .btn-live { background-color: #ffc107; border: none; font-weight: bold; }
        .time-badges .badge { padding: 8px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; margin-left: 5px; }
        .badge-normal { background-color: #0dcaf0; color: #000; }
        .badge-alert { background-color: #ffc107; color: #000; }
        .badge-urgent { background-color: #dc3545; color: #fff; }

        .ticket-card { background: #fff; border: 1px solid var(--color-nude); border-radius: 16px; border-top: 5px solid #0d6efd; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; height: 100%; }
        .ticket-card.warning { border-top-color: #ffc107; }
        .ticket-card.danger { border-top-color: #dc3545; }
        .ticket-header { padding: 12px 15px; border-bottom: 1px solid var(--color-nude); display: flex; justify-content: space-between; align-items: center; font-weight: 800; background-color: #fafafa; border-radius: 16px 16px 0 0; }
        .ticket-body { padding: 0; flex-grow: 1; }
        .kds-item { padding: 12px 15px; border-bottom: 1px solid var(--color-nude); display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; transition: background-color 0.2s; }
        .kds-item:hover { background-color: #f8f9fa; }
        .item-qty { background-color: var(--text-dark); color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 800; margin-right: 12px; font-size: 1.1rem; }
        .item-name { font-size: 1.05rem; font-weight: 600; }
        .item-notes { font-size: 0.85rem; color: #d35400; margin-top: 4px; font-weight: 600; }
        .btn-ready { background-color: #198754; color: white; border: none; border-radius: 8px; padding: 5px 12px; font-weight: bold; }
        .empty-state { text-align: center; margin-top: 5rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-scrollable">
            <div class="brand-header">
                <div class="brand-avatar"><i class="fa-solid fa-fire-burner"></i></div>
                <div>
                    <h2 class="brand-title">SazónTrack</h2>
                    <span class="brand-sub">KDS Cocina</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="mesas.html" class="nav-link"><i class="fa-solid fa-utensils"></i> Mapa Mesas</a>
                <a href="kds_cocina.html" class="nav-link active"><i class="fa-solid fa-fire-burner"></i> KDS Cocina</a>
                <a href="kds_barra.html" class="nav-link"><i class="fa-solid fa-martini-glass"></i> KDS Barra</a>
            </nav>
        </div>
        <div class="user-profile">
            <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-circle-user fa-2x text-muted"></i>
                <div style="line-height: 1.2;">
                    <strong class="d-block" style="font-size: 0.85rem;">Yazmin Areli Vasquez Garcia</strong>
                    <small class="text-muted" style="font-size: 0.75rem;">Administrador</small>
                </div>
            </div>
            <a href="#" class="text-danger"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </aside>

    <main class="main-wrapper">
        <div class="kds-header-top">
            <div>
                <h3 class="fw-800 m-0"><i class="fa-solid fa-fire-burner text-warning me-2"></i>KDS - Pantalla de Cocina</h3>
                <p class="text-muted mb-0">Control de Comandas en Cocina</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-outline-dark rounded-pill fw-bold"><i class="fa-solid fa-clock-rotate-left"></i> Ver Despachados</button>
                <button class="btn btn-live rounded-pill"><i class="fa-solid fa-arrows-rotate"></i> Live <span id="segundosRefresh">5</span>s</button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-dark rounded-pill px-4">Todos</button>
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4 ms-2"><i class="fa-solid fa-circle text-warning small me-1"></i> Pendientes</button>
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4 ms-2"><i class="fa-solid fa-circle text-primary small me-1"></i> Preparacion</button>
            </div>
            <div class="time-badges">
                <span class="badge badge-normal">< 10 min (Normal)</span>
                <span class="badge badge-alert">10 - 15 min (Alerta)</span>
                <span class="badge badge-urgent">> 15 min (Urgente)</span>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="contenedorComandas">
            <!-- Tickets inyectados por JS -->
        </div>
    </main>

    <script>
        const AREA_FILTRO = 'cocina'; 
        let countdown = 5;

        document.addEventListener('DOMContentLoaded', () => {
            cargarComandasKDS();
            setInterval(() => {
                countdown--;
                if(countdown <= 0) {
                    cargarComandasKDS();
                    countdown = 5;
                }
                document.getElementById('segundosRefresh').innerText = countdown;
            }, 1000);
            setInterval(actualizarTiempos, 1000);
        });

        function actualizarTiempos() {
            const ahora = new Date();
            document.querySelectorAll('.tiempo-espera').forEach(el => {
                const tiempoCreacion = new Date(el.dataset.fecha).getTime();
                const minTranscurridos = Math.floor((ahora.getTime() - tiempoCreacion) / 60000);
                el.innerText = `${minTranscurridos} min`;

                const tarjeta = el.closest('.ticket-card');
                if (minTranscurridos >= 15) {
                    tarjeta.classList.add('danger');
                    tarjeta.classList.remove('warning');
                } else if (minTranscurridos >= 10) {
                    tarjeta.classList.add('warning');
                    tarjeta.classList.remove('danger');
                }
            });
        }

        async function cargarComandasKDS() {
            try {
                const resp = await fetch('api/comandas/listar_pendientes_cocina.php');
                const comandas = await resp.json();
                renderizarComandas(comandas);
            } catch (error) {
                console.error("Error al obtener comandas:", error);
            }
        }

        function renderizarComandas(comandas) {
            const contenedor = document.getElementById('contenedorComandas');
            contenedor.innerHTML = '';
            let ticketsVisibles = 0;

            if (comandas.length === 0) {
                mostrarMensajeVacio(contenedor);
                return;
            }

            comandas.forEach(orden => {
                // Filtrar solo items que contengan 'cocina' en el área de preparación
                let itemsFiltrados = orden.detalles.filter(item => {
                    return item.area_preparacion && item.area_preparacion.toLowerCase().includes(AREA_FILTRO);
                });

                if (itemsFiltrados.length === 0) return;
                
                ticketsVisibles++;
                
                let htmlDetalles = '';
                itemsFiltrados.forEach(item => {
                    let notasHtml = item.notas ? `<div class="item-notes"><i class="fa-solid fa-circle-exclamation me-1"></i>${item.notas}</div>` : '';
                    
                    htmlDetalles += `
                        <div class="kds-item" onclick="marcarPreparado(${item.id_detalle}, event)">
                            <div class="d-flex w-100">
                                <div class="item-qty">${item.cantidad}</div>
                                <div>
                                    <div class="item-name">${item.producto}</div>
                                    ${notasHtml}
                                </div>
                            </div>
                            <button class="btn-ready"><i class="fa-solid fa-check"></i></button>
                        </div>
                    `;
                });

                contenedor.insertAdjacentHTML('beforeend', `
                    <div class="col">
                        <div class="ticket-card">
                            <div class="ticket-header">
                                <span class="fs-5">Mesa: <span class="text-dark">${orden.numero_mesa}</span></span>
                                <span class="tiempo-espera text-muted" data-fecha="${orden.fecha_orden}">0 min</span>
                            </div>
                            <div class="ticket-body">
                                ${htmlDetalles}
                            </div>
                        </div>
                    </div>
                `);
            });

            if (ticketsVisibles === 0) {
                mostrarMensajeVacio(contenedor);
            }
        }

        function mostrarMensajeVacio(contenedor) {
            contenedor.innerHTML = `
                <div class="col-12 empty-state">
                    <div class="d-inline-flex justify-content-center align-items-center bg-success text-white rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-check fa-2x"></i>
                    </div>
                    <h4>¡Cocina al día!</h4>
                    <p>No hay órdenes pendientes de comida.</p>
                </div>`;
        }

        async function marcarPreparado(idDetalle, event) {
            if(event) event.stopPropagation();
            try {
                await fetch('api/comandas/actualizar_estado_kds.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_detalle: idDetalle, estado: 'PREPARADO' })
                });
                cargarComandasKDS();
            } catch (error) {
                alert("No se pudo actualizar el estado.");
            }
        }
        
    </script>
